[project]
name = "rag-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "anyio>=4.16.0",
    "asyncpg>=0.32.0",
    "av>=15,<16",  # faster-whisper 1.2 passes av.open(metadata_errors=), which av 19 rejects
    "boto3>=1.44.1",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "dramatiq[redis]>=2.2.1",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "openai>=3.49.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.0.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["S608", "E501"]  # DDL built from module constants, no user input
"app/core/errors.py" = ["S101"]  # asserts narrow the generic handler signature

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "dramatiq.*", "pgvector.*", "boto3.*", "botocore.*", "openpyxl.*", "trafilatura.*", "pypdfium2.*", "pytesseract.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls a real provider; skipped without credentials"]

[tool.coverage.run]
omit = ["alembic/*"]
concurrency = ["greenlet", "thread"]
