[project]
name = "rag-platform"
version = "0.1.0"
description = "Python client for the RAG platform API (/v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
# JSON bodies are Any at the boundary; each helper's TypedDict return type is the contract.
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the backend serve helpers (skipped when they cannot start)"]
