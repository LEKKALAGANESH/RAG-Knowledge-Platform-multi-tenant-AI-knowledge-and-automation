apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: rag-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rag-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: rag-backend
          args: ["api"]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          env:
            # Required by Settings, read only by Alembic: runtime pods get the rag_app URL.
            - name: MIGRATION_DATABASE_URL
              valueFrom: { secretKeyRef: { name: rag-secrets, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            # Query embedding loads the fastembed ONNX model in-process (~0.5 GB).
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: models, mountPath: /models }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        # ponytail: per-pod model cache, downloaded on first use. Swap for a pre-filled
        # ReadOnlyMany PVC when pods scale often or egress to huggingface.co is blocked.
        - name: models
          emptyDir: { sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
spec:
  selector: { app.kubernetes.io/name: rag-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
