# Only the web BFF is public; the API stays cluster-internal (networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag
  annotations:
    # MAX_UPLOAD_MB (configmap.yaml) + 1 MB for the multipart envelope.
    nginx.ingress.kubernetes.io/proxy-body-size: 51m
    # SSE (answers, agent events): no buffering, reads up to the 15 min agent stream.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [rag.example.com]
      secretName: rag-tls  # placeholder: cert-manager or a pre-created TLS Secret
  rules:
    - host: rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: rag-web, port: { name: http } }
