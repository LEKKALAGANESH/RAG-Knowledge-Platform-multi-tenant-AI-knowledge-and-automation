# Base manifests. Postgres (pgvector), Redis, S3/MinIO and (optional) Qdrant are EXTERNAL: point the
# Secret/ConfigMap at them. Deploy through an overlay (see ../overlays/example), never the base as is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rag
labels:
  - pairs:
      app.kubernetes.io/part-of: rag
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
images:
  - name: rag-backend
    newTag: local
  - name: rag-web
    newTag: local
