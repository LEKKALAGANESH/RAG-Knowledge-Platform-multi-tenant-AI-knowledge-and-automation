# TEMPLATE ONLY: placeholders, no real values. Replace through your secret manager (External Secrets,
# Sealed Secrets, SOPS) or an overlay secretGenerator; never commit filled-in values.
# The placeholders fail closed: JWT_SECRET/FERNET_KEYS are validated at startup.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
type: Opaque
stringData:
  # rag_app: DML only, RLS applies (ADR 0009). Runtime pods also get it as MIGRATION_DATABASE_URL,
  # which only Alembic reads, so they never hold owner credentials.
  DATABASE_URL: postgresql+asyncpg://rag_app:REPLACE_ME@postgres.example.internal:5432/rag
  REDIS_URL: redis://:REPLACE_ME@redis.example.internal:6379/0
  JWT_SECRET: REPLACE_ME
  FERNET_KEYS: REPLACE_ME
  API_KEY_PEPPER: REPLACE_ME
  S3_ACCESS_KEY: REPLACE_ME
  S3_SECRET_KEY: REPLACE_ME
  # Optional provider keys: ANTHROPIC_API_KEY, OPENAI_API_KEY, EMBEDDING_API_KEY, QDRANT_API_KEY,
  # *_OAUTH_CLIENT_SECRET. Add them here; every pod reads this Secret via envFrom.
---
# Owner role, read only by the migration Job.
apiVersion: v1
kind: Secret
metadata:
  name: rag-migrate
type: Opaque
stringData:
  MIGRATION_DATABASE_URL: postgresql+asyncpg://rag_owner:REPLACE_ME@postgres.example.internal:5432/rag
