apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-web
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: rag-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rag-web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: rag-web
          ports: [{ name: http, containerPort: 3000 }]
          env:
            # Read at runtime by the BFF (server side only).
            - { name: NEXT_PUBLIC_API_URL, value: "http://rag-api:8000" }
            # The ingress controller is the one proxy in front of Next.
            - { name: TRUSTED_PROXY_HOPS, value: "1" }
            # Must equal the backend's REFRESH_TOKEN_TTL_DAYS.
            - { name: REFRESH_TOKEN_TTL_DAYS, value: "7" }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-web
spec:
  selector: { app.kubernetes.io/name: rag-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
