# No probes: the worker serves no HTTP, and Kubernetes restarts it when the process exits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rag-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rag-worker }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Dramatiq stops gracefully on SIGTERM; give running parses time to finish.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: rag-backend
          # One process per pod; scale with replicas so the memory limit is per process.
          args: ["worker", "--processes", "1", "--threads", "4"]
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom: { secretKeyRef: { name: rag-secrets, key: DATABASE_URL } }
          resources:
            # Parse children are capped by PARSE_MEMORY_MB (2 GiB) / TRANSCRIBE_MEMORY_MB (4 GiB).
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: models, mountPath: /models }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: models
          emptyDir: { sizeLimit: 8Gi }
