name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Throwaway per-run credentials: nothing real is stored in the repo or in GitHub secrets.
      - name: Generate CI-only secrets
        run: |
          gen() { openssl rand -hex 24; }
          for v in POSTGRES_PASSWORD APP_DB_PASSWORD OWNER_DB_PASSWORD REDIS_PASSWORD S3_SECRET_KEY; do
            val=$(gen); echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
          echo "S3_ACCESS_KEY=ci$(openssl rand -hex 8)" >> "$GITHUB_ENV"

      - name: Redis URL
        run: echo "REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379/0" >> "$GITHUB_ENV"

      # The compose file itself (not hand-copied service containers): same images, healthchecks,
      # Redis requirepass, and docker/initdb mounted, so rag_app / rag_owner / rag_definer exist.
      - name: Start Postgres, Redis, MinIO
        working-directory: .
        # The db healthcheck probes TCP, so --wait skips initdb's socket-only temp server.
        run: docker compose -p ragci up -d --wait db redis minio

      - name: Install tesseract (OCR tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ hashFiles('backend/uv.lock') }}

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

      - name: Service logs on failure
        if: failure()
        working-directory: .
        run: docker compose -p ragci logs --tail 200

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # no engines field; vitest needs ^22.12
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit (backend lockfile)
        working-directory: backend
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --frozen -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
      # Container instead of gitleaks-action: no license key needed for org repos.
      - name: gitleaks
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner -v

  # Builds both images (no push) and schema-checks the rendered K8s example overlay.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t rag-backend:ci backend
      - run: docker build -t rag-web:ci frontend
      - name: Smoke the backend image (tesseract, non-root)
        run: docker run --rm --entrypoint sh rag-backend:ci -c 'test "$(id -u)" = 10001 && tesseract --list-langs | grep -qx eng'
      # The api role must exit on SIGTERM (143 = uvicorn re-raising it under tini), not wait for SIGKILL.
      # Startup does not connect to the database, so dummy settings are enough.
      - name: API stops on SIGTERM
        run: |
          docker run -d --name sigterm-api \
            -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:1/x \
            -e MIGRATION_DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:1/x \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e FERNET_KEYS="$(openssl rand -base64 32 | tr '+/' '-_')" rag-backend:ci
          for _ in $(seq 60); do
            docker exec sigterm-api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')" && break
            sleep 1
          done
          start=$(date +%s)
          docker stop -t 20 sigterm-api
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' sigterm-api)
          docker logs sigterm-api 2>&1 | tail -5
          echo "stopped in ${took}s, exit $code"
          test "$code" = 143 && test "$took" -lt 10
      - name: Render + validate deploy/k8s
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" registry.k8s.io/kustomize/kustomize:v5.7.1 \
            build /k8s/overlays/example > "$RUNNER_TEMP/k8s.yaml"
          docker run --rm -v "$RUNNER_TEMP:/m:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 /m/k8s.yaml

  # AC4 retrieval thresholds on the seed set (tests/test_evals.py). Also part of `backend`;
  # this job runs it alone on main and on demand so a regression is named in its own check.
  eval:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CI-only secrets
        run: |
          for v in POSTGRES_PASSWORD APP_DB_PASSWORD OWNER_DB_PASSWORD REDIS_PASSWORD S3_SECRET_KEY; do
            val=$(openssl rand -hex 24); echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
          echo "S3_ACCESS_KEY=ci$(openssl rand -hex 8)" >> "$GITHUB_ENV"
      - name: Redis URL
        run: echo "REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379/0" >> "$GITHUB_ENV"
      - name: Start Postgres, Redis, MinIO
        working-directory: .
        # The db healthcheck probes TCP, so --wait skips initdb's socket-only temp server.
        run: docker compose -p ragci up -d --wait db redis minio
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ hashFiles('backend/uv.lock') }}
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_evals.py
